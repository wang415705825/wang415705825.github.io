---
layout: default
---
<article class="standard-page">
  <header class="page-hero section section--compact">
    <div class="shell shell--narrow">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1{% if page.language %} lang="{{ page.language | escape }}"{% endif %}>{{ page.title }}</h1>
      {% if page.description %}<p class="page-hero__intro">{{ page.description }}</p>{% endif %}
    </div>
  </header>
  <div class="section section--compact">
    <div class="shell shell--narrow prose">
      {{ content }}
    </div>
  </div>
</article>
